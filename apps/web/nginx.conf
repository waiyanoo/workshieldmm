# Static hosting for the SPA.
server {
  listen       80;
  server_name  _;
  root         /usr/share/nginx/html;

  # React Router owns the URL space. Without this fallback, a reload on
  # /admin/promotions asks nginx for a file that does not exist and returns 404
  # — the classic SPA deployment bug, invisible until someone refreshes.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Vite emits content-hashed filenames, so these can be cached indefinitely.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html must NOT be cached: it is the document that names the current
  # hashed bundles, so a stale copy pins users to a previous deployment.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # The API sets its own security headers via helmet; these cover the documents
  # nginx serves directly.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
}
