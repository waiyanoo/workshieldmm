name: Deploy

# Applies .do/app.yaml to a DigitalOcean App Platform app.
#
# Deliberately manual. Schema changes are one-way — migrations are immutable
# once applied and several are not reversible — so a deployment is a decision
# somebody makes, not something a merge triggers.
#
# Migrations are NOT run from here. They are a PRE_DEPLOY job in the app spec,
# so they execute inside DigitalOcean's network: managed databases restrict
# access by trusted source and GitHub runners have dynamic IPs, so migrating
# from CI would mean opening the database to the internet. A failing migration
# aborts the deployment before any new container serves traffic.
#
# Requires, in the GitHub environment named below:
#   secret  DIGITALOCEAN_ACCESS_TOKEN   API token with read/write scope
#   var     DO_APP_ID                   the App Platform app id
#
# Everything else — database URLs, S3 credentials, JWT secrets, the subject
# pepper — lives in the app spec as SECRET env vars and is managed in DO, not
# here. This workflow never handles them.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: environment
        required: true
      image_tag:
        description: Image tag to deploy (a commit SHA, or "latest")
        type: string
        required: true
        default: latest

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Fail here rather than halfway through a deployment.
      - name: Check the image exists
        run: |
          TAG='${{ inputs.image_tag }}'
          for image in api web; do
            if ! docker manifest inspect \
                 "ghcr.io/${{ github.repository }}/$image:$TAG" >/dev/null 2>&1; then
              echo "ghcr.io/${{ github.repository }}/$image:$TAG not found."
              echo "Images are published by CI on pushes to main."
              exit 1
            fi
            echo "found $image:$TAG"
          done

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      # Only IMAGE_TAG is substituted. The spec's other ${...} references —
      # ${db.DATABASE_URL}, ${redis.DATABASE_URL}, ${APP_URL} — are App
      # Platform's own bindable variables and must survive untouched, which is
      # why envsubst is given an explicit variable list.
      - name: Render the app spec
        run: |
          export IMAGE_TAG='${{ inputs.image_tag }}'
          envsubst '${IMAGE_TAG}' < .do/app.yaml > /tmp/app.yaml
          echo "--- images to be deployed ---"
          grep -A1 'repository:' /tmp/app.yaml | grep -E 'repository:|tag:'

      # Applying the spec runs the PRE_DEPLOY migration job, then rolls the
      # api, web and worker components. --wait blocks until the deployment
      # settles, so a failure here is a real failure rather than a timeout.
      - name: Deploy
        run: |
          doctl apps update "${{ vars.DO_APP_ID }}" \
            --spec /tmp/app.yaml \
            --wait \
            --format ID,DefaultIngress,ActiveDeployment.Phase

      # The app's own URL, read back from DO rather than hard-coded, so this
      # keeps working when a custom domain is attached.
      - name: Smoke check
        run: |
          INGRESS=$(doctl apps get "${{ vars.DO_APP_ID }}" \
                    --format DefaultIngress --no-header | tr -d '[:space:]')
          echo "checking $INGRESS"
          # Readiness, not liveness: /ready touches the database, which is the
          # failure a deployment actually produces.
          for i in $(seq 1 30); do
            if curl -fsS "$INGRESS/api/ready" >/dev/null; then
              echo "api ready"
              curl -fsS -o /dev/null "$INGRESS/" && echo "web serving"
              exit 0
            fi
            sleep 10
          done
          echo "API did not become ready at $INGRESS/api/ready"
          doctl apps logs "${{ vars.DO_APP_ID }}" api --type run --tail 50 || true
          exit 1

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "### Deployment"
            echo ""
            echo "- environment: \`${{ inputs.environment }}\`"
            echo "- image tag: \`${{ inputs.image_tag }}\`"
            echo "- app: \`${{ vars.DO_APP_ID }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
