# Local development infrastructure.
# Production uses managed equivalents (RDS/Cloud SQL, ElastiCache, S3) with
# the hosting-jurisdiction decision made alongside Myanmar counsel (§7).
services:
  postgres:
    image: postgres:16-alpine
    container_name: hyper-postgres
    environment:
      # 'hyper' is the owner/migration role. The application connects as the
      # limited 'hyper_app' role created in migration 0001 so that RLS and the
      # append-only audit grants actually bind it.
      POSTGRES_USER: hyper
      POSTGRES_PASSWORD: hyper_pw
      POSTGRES_DB: hyper
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyper -d hyper"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hyper-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for evidence files (encrypted at rest).
  minio:
    image: minio/minio:latest
    container_name: hyper-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the evidence bucket on startup.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/hyper-evidence &&
      mc anonymous set none local/hyper-evidence &&
      echo 'bucket ready';
      "
